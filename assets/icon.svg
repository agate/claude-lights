       White plate, soft shadows, circles lit from above. Rebuild the .icns with scripts/make_icon.sh. --><defs>
  <filter id="cs" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
  </filter>
  <filter id="ps" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".18"/>
  </filter>
  <linearGradient id="gD55E00" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#E8752A"/>
  <stop offset="1" stop-color="#D55E00"/>
  </linearGradient>
  <linearGradient id="gE69F00" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F4B731"/>
  <stop offset="1" stop-color="#E69F00"/>
  </linearGradient>
  <linearGradient id="g009E73" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#16B386"/>
  <stop offset="1" stop-color="#009E73"/>
  </linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/>
  <stop offset="1" stop-color="#F0F0F0"/>
  </linearGradient>
  <clipPath id="sq">
  <rect x="100" y="100" width="824" height="824" rx="184"/>
  </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#plate)" stroke="#E2E2E2" stroke-width="4" filter="url(#ps)"/>
  <circle cx="384" cy="392" r="150" fill="url(#gD55E00)" stroke="#FAFAFA" stroke-width="22" filter="url(#cs)"/>
