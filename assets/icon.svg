<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Claude Lights app icon: the three state glyphs, each in its own light.
       ! vermillion = waiting for you, gear amber = working, check bluish-green = done.
